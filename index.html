<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">

<meta name="apple-mobile-web-app-title" content="Workspace">
<title>🔒 Private Workspace</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#f6f4ef; --panel:#fffdfa; --ink:#2b2621; --muted:#8a8177;
    --line:#e7e1d6; --accent:#3f6b52; --rose:#a4553f; --rose-soft:#f8ebe6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
    display:grid; place-items:center; padding:24px 18px calc(24px + env(safe-area-inset-bottom));
    min-height:100vh; min-height:100dvh;
  }
  .card{
    width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:28px 22px 22px; text-align:center;
    box-shadow:0 1px 2px rgba(43,38,33,.04), 0 10px 30px rgba(43,38,33,.05);
  }
  .mark{font-size:26px; line-height:1; margin-bottom:14px}
  h1{font-size:16px; font-weight:700; letter-spacing:.01em; margin:0 0 6px}
  .sub{font-size:13px; color:var(--muted); margin:0 0 20px}
  form{display:flex; flex-direction:column; gap:10px; text-align:left}
  input[type=password]{
    width:100%; font:inherit; font-size:17px; letter-spacing:.06em;
    padding:13px 14px; border:1px solid var(--line); border-radius:11px;
    background:#fff; color:var(--ink); -webkit-appearance:none; appearance:none;
  }
  input[type=password]:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(63,107,82,.12)}
  button{
    font:inherit; font-size:15px; font-weight:650; padding:13px 14px; border-radius:11px;
    border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer;
    -webkit-appearance:none; appearance:none;
  }
  button:disabled{opacity:.55; cursor:default}
  button:active{transform:translateY(1px)}
  .remember{
    display:flex; align-items:center; gap:8px; justify-content:center;
    margin:16px 0 0; font-size:12.5px; color:var(--muted); cursor:pointer; user-select:none;
  }
  .remember input{width:15px; height:15px; margin:0; accent-color:var(--accent)}
  .err{
    margin:12px 0 0; min-height:18px; font-size:12.5px; color:var(--rose);
    background:transparent; border-radius:8px;
  }
  .err.show{background:var(--rose-soft); padding:8px 10px}
  .foot{margin:18px 0 0; font-size:11px; color:#a9a196; letter-spacing:.01em}
  .busy{display:none; margin:12px 0 0; font-size:12.5px; color:var(--muted)}
  .busy.show{display:block}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">🔒</div>
  <h1>Private Workspace</h1>
  <p class="sub">비밀번호를 입력하면 열립니다.</p>
  <form id="unlock-form" autocomplete="off">
    <input id="pass" name="pass" type="password" inputmode="text" autocapitalize="none"
           autocorrect="off" spellcheck="false" autocomplete="current-password"
           placeholder="password" aria-label="password" required>
    <button type="submit" id="go">Unlock</button>
  </form>
  <label class="remember"><input type="checkbox" id="remember"> 이 기기에서 기억하기</label>
  <p class="err" id="err" role="alert" aria-live="polite"></p>
  <p class="busy" id="busy">잠금 해제 중…</p>
  <p class="foot">AES-256-GCM · PBKDF2-SHA256</p>
  <noscript><p class="err show">JavaScript가 필요합니다.</p></noscript>
</main>

<script>
"use strict";
(function(){
  var ITER = 310000;
  var SALT_LEN = 16, IV_LEN = 12;
  var SESSION_KEY = "pw:session";
  var LOCAL_KEY = "pw:device";
  var form = document.getElementById("unlock-form");
  var field = document.getElementById("pass");
  var go = document.getElementById("go");
  var errEl = document.getElementById("err");
  var busyEl = document.getElementById("busy");
  var rememberEl = document.getElementById("remember");

  function b64ToBytes(s){
    var bin = atob(s.replace(/\s+/g, ""));
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(u){
    var s = "", chunk = 0x8000;
    for (var i = 0; i < u.length; i += chunk) s += String.fromCharCode.apply(null, u.subarray(i, i + chunk));
    return btoa(s);
  }
  function payloadBytes(){ return b64ToBytes(document.getElementById("payload").textContent); }

  function deriveKey(pass, salt){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
        );
      });
  }
  function decryptWithKey(key){
    var data = payloadBytes();
    var salt = data.subarray(0, SALT_LEN);
    var iv = data.subarray(SALT_LEN, SALT_LEN + IV_LEN);
    var ct = data.subarray(SALT_LEN + IV_LEN);
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct)
      .then(function(buf){ return new TextDecoder("utf-8").decode(buf); });
  }
  function writeDoc(html){
    document.open();
    document.write(html);
    document.close();
  }
  function reveal(html){
    // While the parser is still working, document.write appends to this page
    // instead of replacing it, so wait for the load event first.
    if (document.readyState === "complete") { writeDoc(html); return; }
    window.addEventListener("load", function(){ writeDoc(html); }, { once: true });
  }
  function fail(msg){
    errEl.textContent = msg;
    errEl.className = "err show";
    busyEl.className = "busy";
    go.disabled = false;
    field.disabled = false;
    field.select();
  }
  function unlock(pass, remember){
    errEl.textContent = "";
    errEl.className = "err";
    go.disabled = true;
    field.disabled = true;
    busyEl.className = "busy show";
    var data = payloadBytes();
    var salt = data.subarray(0, SALT_LEN);
    deriveKey(pass, salt).then(function(key){
      return decryptWithKey(key).then(function(html){
        try {
          crypto.subtle.exportKey("raw", key).then(function(raw){
            var k = bytesToB64(new Uint8Array(raw));
            try { sessionStorage.setItem(SESSION_KEY, k); } catch(e){}
            if (remember) { try { localStorage.setItem(LOCAL_KEY, k); } catch(e){} }
            else { try { localStorage.removeItem(LOCAL_KEY); } catch(e){} }
          }).catch(function(){});
        } catch(e){}
        reveal(html);
      });
    }).catch(function(){
      try { sessionStorage.removeItem(SESSION_KEY); } catch(e){}
      fail("비밀번호가 맞지 않습니다.");
    });
  }
  function tryStoredKey(){
    var stored = null;
    try { stored = sessionStorage.getItem(SESSION_KEY); } catch(e){}
    if (!stored) { try { stored = localStorage.getItem(LOCAL_KEY); } catch(e){} }
    if (!stored) return;
    var data = payloadBytes();
    crypto.subtle.importKey("raw", b64ToBytes(stored), { name: "AES-GCM" }, false, ["decrypt"])
      .then(function(key){ return decryptWithKey(key); })
      .then(function(html){ reveal(html); })
      .catch(function(){
        try { sessionStorage.removeItem(SESSION_KEY); } catch(e){}
        try { localStorage.removeItem(LOCAL_KEY); } catch(e){}
        go.disabled = false;
        field.focus();
      });
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var pass = field.value;
    if (!pass) { fail("비밀번호를 입력해 주세요."); return; }
    unlock(pass, !!rememberEl.checked);
  });

  if (!(window.crypto && crypto.subtle)) {
    fail("이 브라우저에서는 잠금 해제를 지원하지 않습니다. Safari나 Chrome에서 열어 주세요.");
    go.disabled = true;
  } else {
    tryStoredKey();
    field.focus();
  }
})();
</script>
</body>
